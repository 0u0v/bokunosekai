<style>
  /* ★★★**形は「僕の世界」の入り口と同じ。**組み方・class名・余白・動き（rise / fade）・
     　　色の役割（night=地／lift=ボタンの地／line=枠／paper=文字／dim=薄い文字／flame=差し色）は
     　　そのまま使っている。
     ★★**色は僕の世界の入り口と同じもの**＝ここは作者のページで、Xのプロフィールから来た人が
     　　最初に見る顔になる。作品ごとに色を変えるのは各作品の入り口の役目。
     ★★★**階層を作らない**＝作品を選んでからサイトを選ぶ形にすると、押す回数が1つ増えるたびに人が減る。
     　　作品が数本のうちは、**サイトのボタンを作品の下へ直に並べる**ほうが届く。
     ★**作者ページは下**＝来た人はまず読みたいのであって、追うのは読んだ後。 */
  :root {
    color-scheme: dark;
    --night:   #080c14;
    --lift:    #111a2a;
    --line:    #263349;
    --paper:   #f0ebe0;
    --dim:     #8590a6;
    --flame:   #dcae55;

    --maru: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4",
            "Hiragino Maru Gothic Pro", "Noto Sans JP",
            "Yu Gothic Medium", "Meiryo", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html { background: var(--night); }

  body {
    margin: 0;
    background:
      radial-gradient(90% 50% at 50% 0%, #0d1524 0%, #080c14 70%),
      var(--night);
    color: var(--paper);
    font-family: var(--maru);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  main {
    position: relative;
    width: 100%;
    max-width: 24rem;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 2.6rem 1.9rem 4.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: clamp(2rem, 6vh, 2.8rem);
  }

  .top { width: 100%; }

  .title {
    margin: 0;
    font-size: clamp(1.95rem, 8.4vw, 2.35rem);
    font-weight: 600;
    letter-spacing: .06em;
    line-height: 1.6;
    animation: rise 1.4s .1s both;
  }

  .catch {
    margin: 1.1rem 0 0;
    font-size: .92rem;
    font-weight: 500;
    line-height: 2;
    color: var(--dim);
    animation: rise 1.6s .5s both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(.5rem); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ★枠で囲んだぶん、作品と作品のあいだは詰めてよい（枠が切れ目を作っている） */
  .bottom { width: 100%; display: flex; flex-direction: column; gap: 1.35rem; }

  /* ★★★**作品ごとに枠で囲む**＝囲まないと、**題とボタンの距離**と
     　**作品と作品の距離**がほぼ同じになり、**どのボタンがどの作品のものか目で切れない。**
     　◆位置と余白だけで見せる手もあるが、**作品が増えるほど弱くなる。**枠は増えても効く。
     　◆★**色では分けない**＝色に意味を持たせると、見分けにくい人に届かない。
     　　枠と地の明るさだけで塊にする。
     ★地はボタン（--lift）より暗くする＝**枠の中でボタンが浮いて見える**ようにするため。 */
  .work {
    padding: 1rem 1rem 1.05rem;
    border: 1px solid var(--line);
    border-radius: 1.1rem;
    background: #0e1523;
    animation: rise 1.5s .8s both;
  }
  .work + .work { animation-delay: 1s; }

  .wname {
    margin: 0;
    font-size: 1.02rem;
    font-weight: 600;
    letter-spacing: .02em;
    line-height: 1.7;
  }
  /* ★題は「意味の切れ目」でしか折り返さない＝そのままだと語の途中で切れる。
     　★改行を打ち込まない（狭い画面と広い画面のどちらかで必ず不格好になる）。
     　→ かたまりを inline-block にして、切れ目を「かたまりの間」だけにする。 */
  .wname span { display: inline-block; }

  .wnote {
    margin: .4rem 0 .7rem;
    font-size: .76rem;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  /* ★★サイトのボタンは横に3つ＝1作品が1画面のうち3行に収まる。
     　狭い画面では字が詰まるので、下限を切って縦へ落とす。 */
  .doors {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .5rem;
  }
  /* ★★★**縦並びへ落とすのは、横に3つ入らなくなってから**＝
     　落とした瞬間に6ボタンが縦に積み上がり、**1画面に収まらなくなる**（320×640で302px溢れた）。
     　★このページの値打ちは「1画面で全部見えること」なので、**溢れるくらいなら字を詰める。**
     　★320pxでも横3つは入る（枠259px − 隙間16px ＝ 各81px。「エブリスタ」は5字で約75px）。 */
  @media (max-width: 17rem) {
    .doors { grid-template-columns: 1fr; }
  }

  .door {
    display: block;
    padding: .8rem .3rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--lift);
    color: var(--paper);
    text-decoration: none;
    font-size: .82rem;
    font-weight: 600;
    letter-spacing: -.01em;
    transition: border-color .25s, background .25s, color .25s, transform .25s;
  }
  .door:hover, .door:focus-visible {
    border-color: var(--flame);
    background: #17233a;
    color: var(--flame);
    transform: translateY(-2px);
  }
  .door:focus-visible { outline: 2px solid var(--flame); outline-offset: 3px; }

  .line {
    border: 0;
    border-top: 1px solid var(--line);
    margin: .2rem 0 0;
    width: 100%;
    animation: fade 1.4s 1.4s both;
  }

  .maker { animation: fade 1.4s 1.5s both; }
  .maker p {
    margin: 0 0 .7rem;
    font-size: .74rem;
    color: var(--dim);
  }
  .marus {
    display: flex;
    justify-content: center;
    gap: .7rem;
  }
  .maru {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.7rem;
    height: 2.7rem;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--lift);
    color: var(--dim);
    text-decoration: none;
    font-size: .66rem;
    font-weight: 600;
    line-height: 1.15;
    transition: border-color .25s, color .25s, transform .25s;
  }
  .maru:hover, .maru:focus-visible {
    border-color: var(--flame);
    color: var(--flame);
    transform: translateY(-2px);
  }
  .maru:focus-visible { outline: 2px solid var(--flame); outline-offset: 3px; }

  .foot {
    position: absolute;
    left: 1.5rem;
    right: 1.5rem;
    bottom: clamp(1.2rem, 3.5vh, 1.9rem);
    margin: 0;
    font-size: .72rem;
    color: var(--dim);
  }

  /* ★★**背の低い画面では余白から詰める**＝このページの値打ちは「1画面で全部見えること」。
     　字やボタンを小さくする前に、まず余白を削る（読みやすさは落とさない）。 */
  @media (max-height: 700px) {
    main { padding: 1.1rem 1.4rem 2.6rem; gap: 1rem; }
    .title { font-size: 1.7rem; }
    /* ★★**背が足りない回は、説明の一行を落とす**＝「読める場所の一覧です。」は
       　題（0u0）と、その下の作品名・サイト名で読み取れる。**削っても意味は減らない。**
       　★削る順は「無くても意味が通るもの」から。ボタンと作品名には手を付けない。 */
    .catch { display: none; }
    .bottom { gap: .9rem; }
    .work { padding: .75rem .85rem .8rem; border-radius: .9rem; }
    .wnote { margin: .3rem 0 .55rem; }
    .door { padding: .68rem .3rem; }
    .maru { width: 2.4rem; height: 2.4rem; }
    .maker p { margin-bottom: .5rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .title, .catch, .work, .line, .maker { animation: none; }
    .door, .maru { transition: none; }
  }
</style>
</head>
