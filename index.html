<style>
  :root {
    color-scheme: dark;
    --night:   #080c14;
    --lift:    #111a2a;
    --line:    #263349;
    --paper:   #f0ebe0;
    --dim:     #8590a6;
    --flame:   #dcae55;

    --maru: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4",
            "Hiragino Maru Gothic Pro", "Noto Sans JP",
            "Yu Gothic Medium", "Meiryo", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html { background: var(--night); }

  body {
    margin: 0;
    background:
      radial-gradient(90% 50% at 50% 0%, #16223a 0%, #080c14 70%),
      var(--night);
    color: var(--paper);
    font-family: var(--maru);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  main {
    position: relative;
    width: 100%;
    max-width: 24rem;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 2rem 1.9rem 4.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: clamp(2.4rem, 7vh, 3.4rem);
  }

  .top { width: 100%; }

  .title {
    margin: 0;
    font-size: clamp(1.95rem, 8.4vw, 2.35rem);
    font-weight: 600;
    letter-spacing: .04em;
    animation: rise 1.4s .1s both;
  }

  .catch {
    margin: 1.3rem 0 0;
    font-size: clamp(.95rem, 4.4vw, 1.1rem);
    font-weight: 500;
    line-height: 2.05;
    color: var(--paper);
    animation: rise 1.6s .6s both;
  }
  .catch .fade { color: var(--dim); }

  .author {
    margin: 1.2rem 0 0;
    font-size: .8rem;
    color: var(--dim);
    animation: fade 1.4s 1.4s both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(.5rem); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .bottom { width: 100%; }

  .doors {
    display: flex;
    flex-direction: column;
    gap: .65rem;
  }

  .door {
    display: block;
    padding: .95rem 1rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--lift);
    color: var(--paper);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
    transition: border-color .25s, background .25s, color .25s, transform .25s;
  }
  .door:hover, .door:focus-visible {
    border-color: var(--flame);
    background: #17233a;
    color: var(--flame);
    transform: translateY(-2px);
  }
  .door:focus-visible { outline: 2px solid var(--flame); outline-offset: 3px; }

  .foot {
    position: absolute;
    left: 1.5rem;
    right: 1.5rem;
    bottom: clamp(1.4rem, 4vh, 2.2rem);
    margin: 0;
    font-size: .74rem;
    color: var(--dim);
  }
  .foot b { font-weight: 600; color: var(--paper); font-variant-numeric: tabular-nums; }
  .foot .sep { opacity: .45; padding: 0 .5em; }

  @media (prefers-reduced-motion: reduce) {
    .title, .catch, .author { animation: none; }
    .door { transition: none; }
  }
</style>
</head>
<body>

<main>
  <div class="top">
    <h1 class="title">僕の世界</h1>

    <p class="catch">
      本日は、まだ何も始まっておりません。<br>
      <span class="fade">なにひとつ。</span>
    </p>

    <p class="author">0u0</p>
  </div>

  <div class="bottom">
    <nav class="doors">
            <a class="door" href="go/narou.html">小説家になろう</a>
      <a class="door" href="go/kakuyomu.html">カクヨム</a>
      <a class="door" href="go/estar.html">エブリスタ</a>
    </nav>
  </div>

  <p class="foot">どこで読んでも同じ本文<span class="sep">／</span>8月は<b>毎日21時</b>更新</p>
</main>

</body>
</html>
